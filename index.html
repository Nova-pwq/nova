:root{
  --bg:#18222d;--card:#1f2a36;--line:rgba(255,255,255,.055);--text:#fff;--sub:#8c99a6;
  --accent:linear-gradient(135deg,#2b8be0 0%,#5ac8fa 45%,#bf5af2 100%);
  --accent-text:#fff;--link:#5ac8fa;--del:#ec6a62;
  --ease:cubic-bezier(.22,1,.36,1);
  box-sizing:border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{scroll-behavior:smooth}
body{
  background:#222328;min-height:100vh;
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);
  display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap;
  padding:calc(40px + env(safe-area-inset-top,0px)) 14px calc(90px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
}

/* ===== Паралакс-фон ===== */
.parallax-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#222328}
.pl{position:absolute;inset:-12%;will-change:transform}
.pl.img{background:var(--bgimg) center/cover no-repeat;opacity:1;filter:none}
.pl.img2{background:var(--bgimg) center/cover no-repeat;opacity:.1;filter:none;mix-blend-mode:screen}
.pl.orbs{display:none}
.pl.dots{display:none}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(10,10,14,.4) 100%)}

/* ===== Телефони ===== */
.phone{
  width:460px;max-width:100%;position:relative;overflow:hidden;border-radius:20px;
  background:#1a232e;
  border:1px solid #3a4654;
  box-shadow:0 8px 24px rgba(0,0,0,.55);
  animation:phoneIn .5s ease both;
}
.p2{animation-delay:.08s}
.phone:hover{box-shadow:0 10px 28px rgba(0,0,0,.6)}
.p1{height:660px}.p2{height:633px}
@keyframes phoneIn{from{opacity:0}to{opacity:1}}

/* поетапна поява вмісту */
.rv{opacity:0;translate:0 18px;animation:rv .7s var(--ease) forwards;animation-delay:calc(var(--d,0) * 70ms + 250ms)}
@keyframes rv{to{opacity:1;translate:0 0}}

.avatar{
  width:76px;height:76px;border-radius:50%;margin:30px auto 0;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.avatar img{position:relative;z-index:1;width:68px;height:68px;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--bg);box-sizing:content-box;width:70px;height:70px;transition:transform .5s var(--ease)}

h1{font-size:19px;font-weight:700;text-align:center;margin:22px 0 0;letter-spacing:.2px}
.user{text-align:center;color:#a0adb8;font-size:13px;margin-top:8px}

.tokenbox{margin:22px 14px 0;background:#151d27;border:1px solid #3a4654;border-radius:12px;padding:13px}
.token{background:#243240;border-radius:10px;height:44px;display:flex;align-items:center;padding:0 14px;gap:14px;color:#cfd8e0;position:relative;overflow:hidden}
.token span{flex:1;height:14px;background:repeating-linear-gradient(90deg,#8a95a1 0 2px,#4b5966 2px 5px,#aab3bd 5px 6px,transparent 6px 8px);opacity:.95;border-radius:4px}

/* ===== Кнопки ===== */
.btns{display:flex;gap:10px;margin-top:10px}

  flex:1;height:46px;border:0;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;

.btns button:focus-visible,.row:focus-visible,.params-btn:focus-visible,.toggle:focus-visible{outline:2px solid #5ac8fa;outline-offset:2px}
.copy,.badge{

}
@keyframes gradFlow{

}
.rev{background:#d9554c;color:#fff}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;scale:0;animation:ripple .5s ease-out forwards;z-index:-1}

.note{margin:16px 27px 0;font-size:14px;line-height:1.45;color:#a0adb8}

.list{margin:12px 14px 0;background:#243240;border-radius:12px;overflow:hidden;border:1px solid #3a4654}
.row{display:flex;align-items:center;min-height:46px;padding:0 14px;position:relative;font-size:15px;font-weight:600;cursor:pointer;
  transition:background .15s;user-select:none;-webkit-user-select:none;color:#fff}
.row+.row::before{content:"";position:absolute;left:48px;right:0;top:0;height:1px;background:#2e3a48}
.row:hover{background:#2c3848}

.row .t{flex:1;min-width:0;white-space:nowrap;overflow:visible}

.row:hover .chev{stroke:#d0d8e0}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:8px}
.row.blue{color:var(--link)}.row.blue svg.i{stroke:url(#accG)}

.hint{margin:12px 18px 0;font-size:13px;line-height:1.4;color:#a0adb8}

/* ===== Панель кольору ===== */

/* toggles у панелі */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}

}

/* слайдер сили 3D */

}
body.theme-light .range-row{border-top-color:rgba(0,0,0,.06)}
body.theme-light .range-row .lab{color:#1a1f26}
body.theme-light .range-row .val{color:#7a8794}

/* блюр вимкнено / чіткість: без soft-scale і blur, логотип лишається плавним */
body.no-blur .phone,
body.crisp .phone{
  filter:none !important;
  --sc:1 !important;
  --tx:0px !important;
}
body.crisp{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
}

body.crisp .phone *{
  -webkit-font-smoothing:antialiased;

}
/* НЕ чіпаємо image-rendering у логотипа — crisp-edges псує якість */
body.crisp .avatar img,
body.no-blur .avatar img{
  image-rendering:auto !important;
  -ms-interpolation-mode:bicubic;
}

/* 3D tilt — окремий вимикач */
body.no-3d .phone{
  --rx:0deg !important;
  --ry:0deg !important;
}

.theme-seg{display:flex;gap:6px;margin-top:4px}
.theme-seg button{
  flex:1;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:#2a3644;color:#c8d0d8;font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:background .2s,border-color .2s,color .2s;
}
.theme-seg button.active{background:var(--accent);background-image:var(--accent);color:var(--accent-text);border-color:transparent}

body.theme-light .theme-seg button.active{background:var(--accent);background-image:var(--accent);color:var(--accent-text);border-color:transparent}
.params-panel{
  position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:999;width:268px;max-height:min(78vh,640px);overflow-y:auto;
  background:rgba(28,38,48,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:18px;color:#fff;font-family:inherit;
  box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  opacity:0;visibility:hidden;translate:0 14px;scale:.95;transform-origin:bottom right;
  transition:opacity .3s var(--ease),translate .4s var(--ease),scale .4s var(--ease),visibility 0s .4s;
}
.params-panel.open{opacity:1;visibility:visible;translate:0 0;scale:1;transition-delay:0s}
.params-panel h3{margin:0 0 14px;font-size:15px;font-weight:700;color:#e8eef4;letter-spacing:.2px}
.params-panel .section{margin-bottom:14px}

.swatch{width:38px;height:38px;border-radius:12px;border:2px solid transparent;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .25s var(--ease),border-color .2s,box-shadow .25s}
.swatch:hover{transform:scale(1.14) rotate(-3deg);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.swatch:active{transform:scale(.92)}
.swatch.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.3);transform:scale(1.05)}
.params-panel input[type=color]{width:100%;height:36px;border:0;border-radius:10px;cursor:pointer;background:transparent;padding:0}

  background:rgba(31,42,54,.95);border:1px solid rgba(255,255,255,.12);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s,translate .45s var(--ease);pointer-events:none}

@media(max-width:430px){body{gap:22px;padding-top:calc(22px + env(safe-area-inset-top,0px))}.phone{border-radius:22px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv{opacity:1;translate:0 0}
}


/* =====================================================
   АНІМАЦІЇ (без неону; текст не рухається і не розмивається)
   ===================================================== */
@keyframes spin{to{rotate:360deg}}
@keyframes sweep{0%{translate:-120% 0}55%,100%{translate:120% 0}}
@keyframes drift{from{scale:1;translate:0 0}to{scale:1.06;translate:-1.5% 1%}}
@keyframes drift2{from{scale:1.04;translate:1% 0}to{scale:1;translate:-1% 1.5%}}
@keyframes cbRise{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--sw),calc(-100vh - 360px),0)}}
@keyframes cbSpin{0%{rotate:0deg;scale:1 1}50%{rotate:180deg;scale:.8 1}100%{rotate:360deg;scale:1 1}}
@keyframes phoneIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes phoneBorder{0%,100%{border-color:#3a4654}50%{border-color:#4d5b6c}}
@keyframes avatarIn{0%{opacity:0;scale:.2;rotate:-160deg}70%{opacity:1;scale:1.1;rotate:8deg}100%{opacity:1;scale:1;rotate:0deg}}
@keyframes wave{0%{scale:1;opacity:.5}100%{scale:1.7;opacity:0}}
@keyframes letterIn{0%{opacity:0;translate:0 22px;rotate:-14deg}60%{opacity:1;translate:0 -5px;rotate:3deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes charIn{from{opacity:0;translate:-6px 0}to{opacity:1;translate:0 0}}
@keyframes jump{0%,100%{translate:0 0}40%{translate:0 -7px}}
@keyframes rowIn{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@keyframes barScan{to{background-position-x:8px}}
@keyframes keyWiggle{0%,86%,100%{rotate:0deg}89%{rotate:-18deg}92%{rotate:16deg}95%{rotate:-10deg}98%{rotate:6deg}}
@keyframes nudge{0%,80%,100%{translate:0 0}88%{translate:0 -2px}94%{translate:0 1px}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -2px}}
@keyframes twinkle{0%,70%,100%{scale:1;rotate:0deg}80%{scale:1.22;rotate:18deg}90%{scale:.95;rotate:-8deg}}
@keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-16deg}75%{rotate:16deg}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-3px 0}40%{translate:3px 0}60%{translate:-2px 0}80%{translate:2px 0}}
@keyframes flip{to{transform:rotateY(360deg)}}
@keyframes pop{0%{scale:1}40%{scale:1.3}100%{scale:1}}
@keyframes tilt{0%,100%{rotate:0deg}30%{rotate:-14deg}70%{rotate:12deg}}
@keyframes underline{from{width:0}to{width:34px}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flash{0%{background-color:#243240}30%{background-color:#3a4c5f}100%{background-color:#243240}}
@keyframes btnIn{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
@keyframes swIn{from{opacity:0;scale:0}to{opacity:1;scale:1}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.3) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rt))}}
@keyframes toastPop{0%{scale:.85}60%{scale:1.05}100%{scale:1}}

/* фон — лише повільний drift картинки, без кубиків */
.pl.img{animation:drift 46s ease-in-out infinite alternate}
.pl.img2{animation:drift2 34s ease-in-out infinite alternate}

/* телефони */
.phone{
  background:#1a232e;
  animation:phoneIn .8s var(--ease) backwards,phoneBorder 6s ease-in-out 1s infinite;
  transition:filter .55s ease,transform .5s var(--ease),box-shadow .3s;
}
.p2{animation-delay:.18s,1s}

/* поява вмісту */
.rv-done{animation:none!important;opacity:1!important;translate:none!important;rotate:none!important;scale:none!important}

/* аватар */
.avatar.rv{animation:avatarIn 1s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.35s}
.avatar::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(rgba(255,255,255,.9),rgba(255,255,255,.04) 30%,rgba(255,255,255,.55) 55%,rgba(255,255,255,.04) 80%,rgba(255,255,255,.9));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
  animation:spin 7s linear infinite}
.avatar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:wave 3s ease-out infinite}
.avatar img{transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.avatar:hover img{transform:scale(1.1) rotate(-8deg)}

/* заголовок і нік по літерах */
h1 span{display:inline-block;animation:letterIn .8s var(--ease) backwards;animation-delay:calc(750ms + var(--i)*90ms);cursor:default}
h1 span:hover{animation:jump .45s ease}
.user span{display:inline-block;animation:charIn .5s var(--ease) backwards;animation-delay:calc(1050ms + var(--i)*55ms)}

/* токен — без looping sweep */
.token span{animation:barScan 1.1s linear infinite}
.token svg{animation:keyWiggle 5s ease-in-out 2s infinite;transform-origin:50% 50%}
.token.flash{animation:flash .6s ease}

/* кнопки */
.btns button{isolation:isolate;transition:filter .15s,transform .25s var(--ease)}
.btns button:hover{transform:translateY(-2px)}
.btns button:active{transform:scale(.95)}
/* copy/badge shimmer disabled — gradient stays solid, no looping sweep */
.copy svg{animation:nudge 4s ease-in-out 2.5s infinite}
.rev:hover svg{animation:spin .8s var(--ease)}
.rev.spin svg{animation:spin .8s var(--ease)}
.copy.done svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .05s ease forwards}

/* рядки */
.row{isolation:isolate;overflow:visible;
  background:linear-gradient(90deg,#2c3848,#2c3848) no-repeat left/0 100%;
  transition:background-size .45s var(--ease)}
.row:hover{background:linear-gradient(90deg,#2c3848,#2c3848) no-repeat left/100% 100%}
.row:active{background:linear-gradient(90deg,#334255,#334255) no-repeat left/100% 100%}
.row.red{background:linear-gradient(90deg,rgba(236,106,98,.13),rgba(236,106,98,.13)) no-repeat left/0 100%}
.row.red:hover{background:linear-gradient(90deg,rgba(236,106,98,.13),rgba(236,106,98,.13)) no-repeat left/100% 100%}
.rw{animation:rowIn .7s var(--ease) backwards;animation-delay:calc(650ms + var(--ri,0)*90ms)}
.row svg.i{transition:transform .4s cubic-bezier(.34,1.56,.64,1),stroke .2s}
.row:hover svg.i{transform:scale(1.18)}
.row .chev{transition:translate .35s var(--ease),stroke .2s}
.row:hover .chev{translate:4px 0}
.row .badge{position:relative;overflow:hidden;isolation:isolate}
.row[data-ic="Serverless"] svg.i{animation:floaty 3s ease-in-out infinite}

/* заголовки секцій: лінійка під ними */
h2{position:relative;width:fit-content}
h2::after{
  content:"";position:absolute;left:0;bottom:-6px;height:2px;border-radius:2px;width:34px;
  background-image:var(--accent);background-size:220% 220%;
  animation:underline .8s var(--ease) 1s backwards,gradFlow 5s linear infinite alternate;
}

/* панель кольору */
.params-btn{animation:btnIn .8s var(--ease) 1.3s backwards}
.params-panel.open .swatch{animation:swIn .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--k,0)*35ms + 120ms)}
.toast.show{animation:toastPop .45s var(--ease)}

/* бурст кубиків по кліку */
.bursts{position:fixed;inset:0;z-index:1001;pointer-events:none;overflow:hidden}
.bp{position:absolute;width:var(--s);height:var(--s);animation:burst .85s cubic-bezier(.2,.7,.3,1) forwards}
.bp svg{display:block;width:100%;height:100%}

@media(prefers-reduced-motion:reduce){.bursts{display:none}.avatar::before,.avatar::after{animation:none}}


/* ===== градієнт кольору застосовується скрізь: кнопка, бейдж, лінки, іконка ===== */
.note a,.hint a,.foot a,.row.blue .t{
  background-color:transparent !important;
  background-image:var(--accent) !important;
  background-size:220% 220% !important;
  -webkit-background-clip:text !important;background-clip:text !important;
  -webkit-text-fill-color:transparent !important;color:transparent !important;
  animation:gradFlow 5s linear infinite alternate}

  background-image:var(--accent);

  color:var(--accent-text);-webkit-text-fill-color:var(--accent-text);border-color:transparent}
.toggle.on::after{background:#1a1a1a}

/* ===== Revoke: постійно червоний градієнт ===== */
@keyframes redflow{from{background-position:0% 50%}to{background-position:100% 50%}}
.rev{background:linear-gradient(120deg,#ef5a50,#c9352e 35%,#e8574c 65%,#b5302a);background-size:300% 100%;
  animation:redflow 5s ease-in-out infinite alternate;color:#fff}

/* ===== колонки: soft blur / sharp / 3D tilt ===== */
@media (hover:hover) and (pointer:fine){
  /* м'який режим (блюр увімкнено) */
  .ready:not(.no-blur):not(.crisp) .phone{
    --sc:.94;filter:blur(2.4px);z-index:1;
    transform:perspective(1100px) translateX(var(--tx,0px)) scale(var(--sc)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  }
  .ready:not(.no-blur):not(.crisp) .phone.on{--sc:1;--tx:0px;filter:none;z-index:3}
  .ready:not(.no-blur):not(.crisp).has-on .phone:not(.on){filter:blur(3px)}

  /* чіткий режим: без blur/scale, 3D tilt лишається (якщо не вимкнено) */
  .ready.no-blur .phone,
  .ready.crisp .phone{
    filter:none;--sc:1;z-index:1;
    transform:perspective(1100px) translateX(var(--tx,0px)) scale(1) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  }
  .ready.no-blur .phone.on,
  .ready.crisp .phone.on{z-index:3}

  /* 3D вимкнено — плоско */
  .ready.no-3d .phone{
    transform:translateX(var(--tx,0px)) scale(var(--sc,1)) !important;
  }
  .ready.no-3d.no-blur .phone,
  .ready.no-3d.crisp .phone{
    transform:none !important;
  }
}
@media (hover:hover) and (pointer:fine) and (min-width:830px){
  .ready:not(.no-blur):not(.crisp).has-on .p1:not(.on){--sc:.9;--tx:58px}
  .ready:not(.no-blur):not(.crisp).has-on .p2:not(.on){--sc:.9;--tx:-58px}
}

<script>
window.NOVA_DOCS={"uk": ["## Політика конфіденційності бота Nova\n### 1. Загальні положення\nЦя Політика конфіденційності визначає правила збору, оброблення, використання, зберігання та захисту інформації користувачів під час використання бота Nova.\nNova — цифровий бот, призначений для спілкування, розваг, взаємодії з користувачами та надання доступних функцій на платформі Discord.\nВикористовуючи Nova, ви підтверджуєте, що ознайомилися з цією політикою. Якщо ви не погоджуєтеся з її положеннями, ви можете припинити використання бота.\n### 2. Збір персональних даних\nПід час взаємодії з Nova можуть збиратися або оброблятися різні види інформації залежно від функцій бота, його налаштувань та інформації, яку надає користувач.\nДо такої інформації можуть належати:\n- Ім'я, прізвище, псевдонім або ім'я користувача.\n- Discord ID та інші ідентифікатори облікового запису.\n- Адреса електронної пошти.\n- Номер телефону.\n- Повідомлення, команди, запити та інші дані, які користувач надсилає боту.\n- Інформація про сервери, канали та повідомлення, необхідна для роботи відповідних функцій.\n- Налаштування користувача та збережені параметри.\n- Технічні дані, журнали помилок і відомості про взаємодію з функціями бота.\n- Інші відомості, які користувач добровільно надає через доступні функції.\nНе всі перелічені дані обов'язково збираються. Фактичний перелік залежить від реалізації Nova. Номер телефону та електронна адреса не вважаються автоматично доступними боту лише через використання Discord.\n### 3. Мета оброблення інформації\nЗібрані дані можуть використовуватися для:\n- Забезпечення належної роботи Nova.\n- Виконання команд і оброблення запитів користувачів.\n- Збереження налаштувань та забезпечення персоналізованих функцій.\n- Надання технічної підтримки.\n- Виявлення спаму, шахрайства та зловживань.\n- Захисту бота від несанкціонованого доступу.\n- Виправлення помилок і покращення стабільності.\n- Виконання юридичних обов'язків у випадках, передбачених законодавством.\nІнформація повинна оброблятися для визначених законних цілей і в обсязі, необхідному для їх досягнення.\n### 4. Повідомлення та інформація користувачів\nДля виконання своїх функцій Nova може обробляти повідомлення та команди, які користувачі надсилають безпосередньо боту.\nЯкщо бот працює на Discord-сервері, доступ до повідомлень та інших відомостей залежить від дозволів, налаштувань і технічної реалізації бота.\nПовідомлення у відкритих каналах можуть бути доступними іншим учасникам відповідного сервера згідно з налаштуваннями Discord.\nКористувачам рекомендується не надсилати боту паролі, токени, дані банківських карток та іншу конфіденційну інформацію, якщо відповідна функція не передбачає її безпечного оброблення.\n### 5. Передавання даних третім сторонам\nПерсональні дані не повинні продаватися третім сторонам.\nВодночас для забезпечення роботи Nova певна інформація може оброблятися сторонніми сервісами, зокрема:\n- Discord та його інфраструктурою.\n- Хостинг-провайдерами.\n- Сервісами зберігання даних.\n- Сторонніми API та інтеграціями.\n- Сервісами технічного моніторингу й захисту.\nОбсяг переданих даних залежить від фактичної роботи відповідних інтеграцій.\nПередавання інформації також може здійснюватися у випадках, передбачених чинним законодавством, або коли це законно необхідно для захисту прав і безпеки користувачів.\n### 6. Зберігання та видалення даних\nТривалість зберігання інформації залежить від її призначення, типу даних, технічних можливостей системи та вимог законодавства.\nІнформація може зберігатися протягом періоду, необхідного для роботи функцій бота, збереження налаштувань, підтримки користувачів, забезпечення безпеки або виконання юридичних обов'язків.\nКористувач може звернутися до відповідального за Nova із запитом щодо доступу, виправлення або видалення своїх даних.\nЗапити розглядаються відповідно до чинного законодавства. Видалення може бути обмежене, якщо зберігання певної інформації необхідне на законних підставах.\nПрипинення використання бота саме по собі не гарантує автоматичного видалення всіх даних.\n### 7. Захист інформації\nДля захисту інформації можуть застосовуватися технічні та організаційні заходи, зокрема обмеження доступу, захист систем, контроль дозволів та інші засоби безпеки.\nДоступ до даних повинен надаватися лише уповноваженим особам у межах їхніх обов'язків.\nВодночас жодна система не може гарантувати абсолютного захисту від усіх можливих загроз.\n### 8. Права користувачів\nВідповідно до застосовного законодавства користувачі можуть мати право:\n- Дізнаватися, чи обробляються їхні персональні дані.\n- Отримувати доступ до своїх даних.\n- Вимагати виправлення неточної інформації.\n- Подавати запити на видалення даних за наявності законних підстав.\n- Вимагати обмеження оброблення або заперечувати проти нього у передбачених законом випадках.\n- Відкликати згоду, якщо оброблення здійснюється на підставі згоди.\n- Звертатися до компетентних органів у разі порушення своїх прав.\nДля реалізації цих прав необхідно звернутися через офіційні канали зв'язку Nova.\nДля перевірки запиту може знадобитися підтвердження належності відповідного облікового запису.\n### 9. Файли cookie та сторонні сервіси\nЯкщо Nova використовує вебсайт, вебпанель або інші онлайн-сервіси, вони можуть застосовувати файли cookie чи подібні технології для авторизації, збереження налаштувань і забезпечення безпеки.\nФактичне використання таких технологій залежить від відповідного сервісу.\nВикористання Discord та інших сторонніх платформ також регулюється їхніми власними умовами та політиками конфіденційності.\n### 10. Дані неповнолітніх\nКористувачі повинні дотримуватися вікових обмежень Discord та інших застосовних сервісів.\nОброблення персональних даних неповнолітніх має здійснюватися відповідно до вимог законодавства, зокрема щодо необхідності згоди законного представника, якщо така згода потрібна.\nЯкщо є підстави вважати, що дані неповнолітнього обробляються з порушенням вимог, можна звернутися до відповідального за Nova.\n### 11. Зміни до політики\nЦя Політика конфіденційності може оновлюватися у зв'язку зі змінами функцій Nova, технічної інфраструктури або законодавства.\nОновлена версія може публікуватися в офіційних каналах або на вебсайті проєкту.\nУ разі істотних змін додаткове повідомлення надається, якщо цього вимагає законодавство.\n### 12. Контактна інформація\nЗ питань збору, використання, захисту або видалення персональних даних користувач може звернутися через офіційні канали підтримки Nova.\nКонтактні дані відповідальної особи мають бути зазначені в офіційному ресурсі проєкту.\n### 13. Прикінцеві положення\nNova прагне забезпечувати належне ставлення до персональних даних користувачів, їх захист і прозорість оброблення відповідно до фактичного функціоналу бота та чинного законодавства.\nКористувачам рекомендується відповідально ставитися до інформації, яку вони надають під час взаємодії з ботом.\nГоловний принцип Nova: дані користувачів мають оброблятися для законних цілей, у необхідному обсязі та з належним рівнем захисту.\nДякуємо за використання Nova.\n", "## Умови надання послуг та використання бота Nova\n### 1. Загальні положення\nNova — цифровий бот, призначений для спілкування, розваг, взаємодії з користувачами та використання доступних функцій на платформі Discord.\nЦі умови визначають правила використання бота, права користувачів, обмеження та відповідальність сторін.\nВикористовуючи Nova, ви погоджуєтеся дотримуватися наведених нижче умов. Якщо ви не погоджуєтеся з ними, ви повинні припинити використання бота.\n### 2. Право власності\nБот Nova, його назва, програмний код, дизайн, функціонал, система роботи та інші оригінальні складові належать відповідному власнику або використовуються ним на законних підставах.\nКористувачам забороняється:\n- Видавати Nova за власний продукт або стверджувати, що вони самостійно його створили.\n- Називати себе власником або розробником бота без відповідного дозволу.\n- Привласнювати авторство на програмний код, функції, дизайн та інші оригінальні складові.\n- Копіювати, поширювати або продавати бота як власний продукт без необхідного дозволу.\n- Видавати офіційний продукт Nova за сторонній проєкт, створений користувачем.\n- Використовувати назву, оформлення або матеріали бота для введення інших осіб в оману.\nВикористання Nova не надає користувачеві права власності на бота, його код або інші складові.\n### 3. Дозволене використання\nКористувачам дозволяється:\n- Спілкуватися з Nova у приватних повідомленнях.\n- Використовувати бота в чатах і Discord-групах.\n- Використовувати доступні функції для розваг, спілкування та отримання відповідей.\n- Взаємодіяти з ботом як із віртуальним співрозмовником або цифровим другом.\n- Додавати бота на Discord-сервери за згодою адміністратора або іншої уповноваженої особи.\n- Використовувати доступні функції відповідно до їхнього призначення.\nНадання доступу до Nova означає дозвіл на використання його доступного функціоналу, але не передачу прав власності на продукт.\n### 4. Додавання бота на сервери\nNova дозволяється додавати на Discord-сервери за згодою адміністратора або іншої особи, яка має відповідні повноваження.\nПід час використання бота на сервері користувачі зобов'язані:\n- Дотримуватися правил Discord і відповідного сервера.\n- Не додавати бота без необхідного дозволу.\n- Не використовувати бота для навмисного порушення роботи сервера.\n- Не перешкоджати іншим користувачам під час взаємодії з ботом.\n- Не стверджувати, що бот належить власнику сервера лише через те, що його було додано на цей сервер.\nАдміністрація сервера може встановлювати додаткові правила використання бота у своїй спільноті, якщо вони не суперечать чинному законодавству та цим умовам.\n### 5. Заборона несанкціонованих змін\nКористувачам забороняється без відповідного дозволу втручатися у внутрішню роботу Nova, змінювати його програмний код, обходити встановлені обмеження або намагатися отримати несанкціонований доступ до закритих систем.\nЗокрема, забороняється:\n- Намагатися зламати або пошкодити роботу бота.\n- Використовувати вразливості для отримання несанкціонованих переваг.\n- Видавати скопійовану або змінену версію за офіційну версію Nova.\n- Використовувати бота для спаму чи масового надсилання небажаних повідомлень.\n- Навмисно перевантажувати бота або перешкоджати його нормальній роботі.\n- Отримувати доступ до даних інших користувачів без належних повноважень.\nБудь-які зміни, модифікації або сторонні інтеграції, що потребують втручання у внутрішню роботу бота, мають бути попередньо погоджені з відповідним правовласником.\n### 6. Правила поведінки користувачів\nПід час використання Nova користувачі повинні дотримуватися правил Discord, правил відповідних серверів і чинного законодавства.\nЗабороняється використовувати бота для:\n- Переслідування, залякування або навмисного провокування інших користувачів.\n- Поширення шкідливого програмного забезпечення чи небезпечних посилань.\n- Шахрайства, обману або введення інших осіб в оману.\n- Порушення приватності інших користувачів.\n- Поширення чужих персональних даних без належних підстав.\n- Організації спаму, масових небажаних розсилок або інших зловмисних дій.\n- Дій, що можуть завдати шкоди боту, його інфраструктурі або іншим користувачам.\nКористувач несе відповідальність за власні дії під час взаємодії з ботом у межах, установлених чинним законодавством.\n### 7. Конфіденційність і персональні дані\nПід час використання Nova можуть оброблятися повідомлення, ідентифікатори Discord, налаштування та інші дані, необхідні для роботи його функцій.\nОброблення інформації здійснюється відповідно до Політики конфіденційності Nova та застосовного законодавства.\nКористувачам рекомендується не передавати боту паролі, токени, банківські дані або іншу конфіденційну інформацію без необхідності.\nКористувачі також повинні поважати приватність інших осіб і не використовувати Nova для несанкціонованого збору чи поширення їхніх даних.\n### 8. Доступність і робота бота\nВласник або відповідальна команда Nova прагне забезпечувати стабільну роботу бота, однак не гарантує його безперервну доступність у будь-який час.\nРобота бота може тимчасово обмежуватися або призупинятися через:\n- Технічне обслуговування та оновлення.\n- Несправності серверів або інфраструктури.\n- Проблеми зі сторонніми сервісами.\n- Обставини, що не залежать від власника бота.\n- Необхідність забезпечення безпеки системи.\nNova може змінювати, оновлювати, додавати чи видаляти функції, а також тимчасово або повністю припиняти роботу бота.\n### 9. Обмеження доступу\nУ разі порушення цих умов, правил Discord або інших застосовних вимог можуть застосовуватися заходи для захисту бота та його користувачів.\nЗалежно від ситуації це може включати:\n- Тимчасове обмеження доступу до окремих функцій.\n- Обмеження можливості взаємодіяти з ботом.\n- Блокування доступу до бота.\n- Відмову в подальшому наданні послуг у випадках, коли для цього є належні підстави.\n- Видалення бота із серверів у межах доступних технічних можливостей.\nЗаходи застосовуються з урахуванням характеру порушення, його серйозності та застосовного законодавства.\n### 10. Відповідальність і межі використання\nNova надається для спілкування, розваг і використання передбачених функцій.\nВласник або відповідальна команда не гарантує, що бот завжди працюватиме без помилок, буде доступний без перерв або надаватиме виключно точні, повні й актуальні відповіді.\nКористувач повинен самостійно оцінювати отриману інформацію та перевіряти її, якщо вона використовується для важливих рішень.\nЖодне положення цих умов не звільняє відповідальну сторону від відповідальності, яку неможливо виключити або обмежити відповідно до чинного законодавства.\n### 11. Сторонні сервіси\nNova може працювати з використанням Discord, хостинг-платформ, API та інших сторонніх сервісів.\nВикористання таких платформ регулюється їхніми власними умовами та політиками.\nВласник Nova не контролює всі аспекти роботи сторонніх платформ і не може гарантувати їхню безперервну доступність.\nКористувачі зобов'язані дотримуватися правил відповідних платформ під час використання бота.\n### 12. Зміни до умов\nЦі умови можуть оновлюватися у зв'язку зі змінами функціоналу Nova, правил використання, технічної інфраструктури або законодавства.\nОновлена версія може публікуватися в офіційних каналах або на вебсайті проєкту.\nУ разі істотних змін додаткове повідомлення надається, якщо цього вимагає законодавство.\nКористувачам рекомендується періодично переглядати актуальну версію умов.\n### 13. Контактна інформація\nЗ питань використання Nova, повідомлення про порушення, технічні проблеми або уточнення положень цих умов користувачі можуть звертатися через офіційні канали підтримки проєкту.\nКонтактні дані мають бути опубліковані у відповідному офіційному ресурсі.\n### 14. Прикінцеві положення\nКористувачі можуть спілкуватися з Nova, користуватися доступними функціями та додавати бота на Discord-сервери з дозволу уповноваженої особи.\nВодночас таке використання не передає користувачам прав власності на бота та не надає права привласнювати його авторство, копіювати його як власний продукт або втручатися в його внутрішню роботу без відповідного дозволу.\nКожен користувач повинен поважати права власника, працю розробників, приватність інших осіб і встановлені правила використання.\nГоловний принцип Nova: ви можете користуватися ботом і його доступними функціями, але не можете привласнювати його собі, видавати за власний продукт або змінювати без необхідного дозволу.\nДякуємо за використання Nova та за повагу до правил нашого проєкту.\n"], "en": ["## Nova Bot Privacy Policy\n### 1. General Provisions\nThis Privacy Policy sets out the rules for collecting, processing, using, storing and protecting users' information when using the Nova bot.\nNova is a digital bot designed for communication, entertainment, interaction with users and providing available features on the Discord platform.\nBy using Nova, you confirm that you have read this policy. If you do not agree with its provisions, you may stop using the bot.\n### 2. Collection of Personal Data\nWhen interacting with Nova, various types of information may be collected or processed depending on the bot's features, its settings and the information provided by the user.\nSuch information may include:\n- First name, last name, nickname or username.\n- Discord ID and other account identifiers.\n- Email address.\n- Phone number.\n- Messages, commands, requests and other data the user sends to the bot.\n- Information about servers, channels and messages required for the relevant features to work.\n- User settings and saved parameters.\n- Technical data, error logs and information about interaction with the bot's features.\n- Other information that the user voluntarily provides through available features.\nNot all of the listed data is necessarily collected. The actual list depends on how Nova is implemented. A phone number and email address are not considered automatically available to the bot merely through the use of Discord.\n### 3. Purposes of Processing\nThe collected data may be used for:\n- Ensuring that Nova works properly.\n- Executing commands and processing user requests.\n- Saving settings and providing personalized features.\n- Providing technical support.\n- Detecting spam, fraud and abuse.\n- Protecting the bot from unauthorized access.\n- Fixing errors and improving stability.\n- Fulfilling legal obligations in cases provided for by law.\nInformation must be processed for specified lawful purposes and only to the extent necessary to achieve them.\n### 4. User Messages and Information\nTo perform its functions, Nova may process messages and commands that users send directly to the bot.\nIf the bot operates on a Discord server, access to messages and other information depends on permissions, settings and the technical implementation of the bot.\nMessages in public channels may be accessible to other members of the relevant server according to Discord's settings.\nUsers are advised not to send the bot passwords, tokens, bank card details or other confidential information unless the relevant feature provides for its secure processing.\n### 5. Disclosure to Third Parties\nPersonal data must not be sold to third parties.\nAt the same time, to keep Nova running, certain information may be processed by third-party services, including:\n- Discord and its infrastructure.\n- Hosting providers.\n- Data storage services.\n- Third-party APIs and integrations.\n- Technical monitoring and protection services.\nThe amount of data transferred depends on how the relevant integrations actually work.\nInformation may also be disclosed in cases provided for by applicable law, or where it is lawfully necessary to protect the rights and safety of users.\n### 6. Data Storage and Deletion\nThe retention period depends on the purpose of the information, the type of data, the technical capabilities of the system and legal requirements.\nInformation may be stored for as long as needed for the bot's features to work, to keep settings, to support users, to ensure security or to fulfil legal obligations.\nA user may contact the person responsible for Nova with a request to access, correct or delete their data.\nRequests are handled in accordance with applicable law. Deletion may be limited if retaining certain information is necessary on lawful grounds.\nStopping use of the bot does not by itself guarantee automatic deletion of all data.\n### 7. Information Security\nTechnical and organizational measures may be applied to protect information, including access restrictions, system protection, permission control and other security measures.\nAccess to data must be granted only to authorized persons within the scope of their duties.\nAt the same time, no system can guarantee absolute protection against all possible threats.\n### 8. User Rights\nUnder applicable law, users may have the right to:\n- Find out whether their personal data is being processed.\n- Access their data.\n- Request correction of inaccurate information.\n- Submit requests for data deletion where there are lawful grounds.\n- Request restriction of processing or object to it in cases provided by law.\n- Withdraw consent where processing is based on consent.\n- Contact the competent authorities if their rights are violated.\nTo exercise these rights, you must contact Nova through its official communication channels.\nVerification that the relevant account belongs to you may be required to process a request.\n### 9. Cookies and Third-Party Services\nIf Nova uses a website, web panel or other online services, they may use cookies or similar technologies for authorization, saving settings and ensuring security.\nThe actual use of such technologies depends on the relevant service.\nThe use of Discord and other third-party platforms is also governed by their own terms and privacy policies.\n### 10. Minors' Data\nUsers must comply with the age restrictions of Discord and other applicable services.\nProcessing of minors' personal data must be carried out in accordance with legal requirements, including the need for a legal guardian's consent where such consent is required.\nIf there are grounds to believe that a minor's data is being processed in violation of the requirements, you may contact the person responsible for Nova.\n### 11. Changes to the Policy\nThis Privacy Policy may be updated due to changes in Nova's features, technical infrastructure or legislation.\nThe updated version may be published in official channels or on the project's website.\nIn case of material changes, additional notice is provided if required by law.\n### 12. Contact Information\nFor questions about the collection, use, protection or deletion of personal data, the user may contact Nova through its official support channels.\nThe contact details of the responsible person must be specified in the project's official resource.\n### 13. Final Provisions\nNova strives to ensure proper treatment of users' personal data, its protection and transparency of processing in line with the bot's actual functionality and applicable law.\nUsers are advised to be responsible about the information they provide when interacting with the bot.\nNova's main principle: user data must be processed for lawful purposes, to the extent necessary and with an appropriate level of protection.\nThank you for using Nova.\n", "## Nova Bot Terms of Service and Use\n### 1. General Provisions\nNova is a digital bot designed for communication, entertainment, interaction with users and use of available features on the Discord platform.\nThese terms set out the rules for using the bot, users' rights, restrictions and the responsibilities of the parties.\nBy using Nova, you agree to comply with the terms below. If you do not agree with them, you must stop using the bot.\n### 2. Ownership\nThe Nova bot, its name, source code, design, functionality, system of operation and other original components belong to the respective owner or are used by them on lawful grounds.\nUsers are prohibited from:\n- Passing Nova off as their own product or claiming that they created it themselves.\n- Calling themselves the owner or developer of the bot without proper permission.\n- Claiming authorship of the source code, features, design and other original components.\n- Copying, distributing or selling the bot as their own product without the necessary permission.\n- Passing the official Nova product off as a third-party project created by the user.\n- Using the bot's name, design or materials to mislead other people.\nUsing Nova does not give the user ownership of the bot, its code or other components.\n### 3. Permitted Use\nUsers are permitted to:\n- Chat with Nova in private messages.\n- Use the bot in chats and Discord groups.\n- Use the available features for entertainment, communication and getting answers.\n- Interact with the bot as a virtual conversation partner or digital friend.\n- Add the bot to Discord servers with the consent of an administrator or another authorized person.\n- Use the available features in accordance with their purpose.\nGranting access to Nova means permission to use its available functionality, but not a transfer of ownership of the product.\n### 4. Adding the Bot to Servers\nNova may be added to Discord servers with the consent of an administrator or another person with the appropriate authority.\nWhen using the bot on a server, users must:\n- Comply with the rules of Discord and the relevant server.\n- Not add the bot without the necessary permission.\n- Not use the bot to deliberately disrupt the server.\n- Not interfere with other users' interaction with the bot.\n- Not claim that the bot belongs to the server owner merely because it was added to that server.\nServer administration may set additional rules for using the bot in its community, provided they do not conflict with applicable law and these terms.\n### 5. Prohibition of Unauthorized Changes\nUsers are prohibited, without proper permission, from interfering with the internal operation of Nova, modifying its source code, bypassing established restrictions or attempting to gain unauthorized access to closed systems.\nIn particular, it is prohibited to:\n- Attempt to hack or damage the bot.\n- Exploit vulnerabilities to gain unauthorized advantages.\n- Pass off a copied or modified version as the official version of Nova.\n- Use the bot for spam or mass sending of unwanted messages.\n- Deliberately overload the bot or interfere with its normal operation.\n- Access other users' data without proper authority.\nAny changes, modifications or third-party integrations that require interfering with the bot's internal operation must be approved in advance by the relevant rights holder.\n### 6. User Conduct Rules\nWhen using Nova, users must comply with the rules of Discord, the rules of the relevant servers and applicable law.\nIt is prohibited to use the bot for:\n- Harassing, intimidating or deliberately provoking other users.\n- Distributing malware or dangerous links.\n- Fraud, deception or misleading other people.\n- Violating other users' privacy.\n- Distributing other people's personal data without proper grounds.\n- Organizing spam, mass unwanted mailings or other malicious actions.\n- Actions that may harm the bot, its infrastructure or other users.\nThe user is responsible for their own actions when interacting with the bot within the limits established by applicable law.\n### 7. Privacy and Personal Data\nWhen using Nova, messages, Discord identifiers, settings and other data necessary for its features to work may be processed.\nInformation is processed in accordance with the Nova Privacy Policy and applicable law.\nUsers are advised not to give the bot passwords, tokens, banking details or other confidential information without necessity.\nUsers must also respect the privacy of others and not use Nova to collect or distribute their data without authorization.\n### 8. Availability and Operation of the Bot\nThe owner or responsible team of Nova strives to ensure stable operation of the bot, but does not guarantee its uninterrupted availability at all times.\nThe bot's operation may be temporarily limited or suspended due to:\n- Maintenance and updates.\n- Server or infrastructure failures.\n- Problems with third-party services.\n- Circumstances beyond the bot owner's control.\n- The need to ensure system security.\nNova may change, update, add or remove features, and may temporarily or permanently stop operating.\n### 9. Access Restrictions\nIf these terms, Discord's rules or other applicable requirements are violated, measures may be taken to protect the bot and its users.\nDepending on the situation, this may include:\n- Temporary restriction of access to certain features.\n- Restriction of the ability to interact with the bot.\n- Blocking access to the bot.\n- Refusal of further service where there are proper grounds.\n- Removal of the bot from servers within the available technical capabilities.\nMeasures are applied taking into account the nature of the violation, its seriousness and applicable law.\n### 10. Liability and Limits of Use\nNova is provided for communication, entertainment and use of the intended features.\nThe owner or responsible team does not guarantee that the bot will always work without errors, be available without interruption, or provide exclusively accurate, complete and up-to-date answers.\nThe user must independently evaluate the information received and verify it if it is used for important decisions.\nNothing in these terms releases the responsible party from liability that cannot be excluded or limited under applicable law.\n### 11. Third-Party Services\nNova may operate using Discord, hosting platforms, APIs and other third-party services.\nThe use of such platforms is governed by their own terms and policies.\nThe owner of Nova does not control all aspects of third-party platforms' operation and cannot guarantee their uninterrupted availability.\nUsers must comply with the rules of the relevant platforms when using the bot.\n### 12. Changes to the Terms\nThese terms may be updated due to changes in Nova's functionality, usage rules, technical infrastructure or legislation.\nThe updated version may be published in official channels or on the project's website.\nIn case of material changes, additional notice is provided if required by law.\nUsers are advised to review the current version of the terms periodically.\n### 13. Contact Information\nFor questions about using Nova, reporting violations, technical problems or clarifying these terms, users may contact the project's official support channels.\nContact details must be published in the relevant official resource.\n### 14. Final Provisions\nUsers may chat with Nova, use its available features and add the bot to Discord servers with the permission of an authorized person.\nAt the same time, such use does not transfer ownership of the bot to users and does not give them the right to claim its authorship, copy it as their own product or interfere with its internal operation without proper permission.\nEvery user must respect the owner's rights, the developers' work, the privacy of others and the established rules of use.\nNova's main principle: you may use the bot and its available features, but you may not appropriate it, pass it off as your own product or modify it without the necessary permission.\nThank you for using Nova and for respecting our project's rules.\n"]};

window.renderCols=function(lang){
  [1,2].forEach(function(n){
    var out=document.getElementById('colText'+n), ta=document.getElementById('textCol'+n);
    if(!out)return;
    if(ta&&ta.value.trim()){out.classList.remove('doc');out.textContent=ta.value;return}
    var esc=function(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
    var d=window.NOVA_DOCS[lang]||window.NOVA_DOCS.en;
    var h='',inl=false;
    d[n-1].split('\n').forEach(function(l){
      if(!l.trim())return;
      var li=l.indexOf('- ')===0;
      if(inl&&!li){h+='</ul>';inl=false}
      if(li){if(!inl){h+='<ul>';inl=true}h+='<li>'+esc(l.slice(2))+'</li>'}
      else if(l.indexOf('### ')===0)h+='<div class="ds">'+esc(l.slice(4))+'</div>';
      else if(l.indexOf('## ')===0)h+='<div class="dt">'+esc(l.slice(3))+'</div>';
      else h+='<p>'+esc(l)+'</p>';
    });
    if(inl)h+='</ul>';
    out.classList.add('doc');out.innerHTML=h;
  });
};
</script>
<script>
(function(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const root=document.documentElement;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;

  /* --- паралакс: миша + скрол + гіроскоп, зі згладжуванням --- */
  const L={img:$('#pl-img'),img2:$('#pl-img2')};
  const depth={img:.012,img2:.025};   // мишка
  const sdepth={img:.04,img2:.08};   // скрол
  const phones=$$('.phone');
  const st={mx:0,my:0,cx:0,cy:0,sy:0,cs:0,gx:0,gy:0};
  let ptr=null;

  addEventListener('mousemove',e=>{
    st.mx=(e.clientX/innerWidth-.5)*2; st.my=(e.clientY/innerHeight-.5)*2;
    ptr={x:e.clientX,y:e.clientY};
  },{passive:true});
  addEventListener('scroll',()=>{st.sy=scrollY},{passive:true});
  function gyro(e){
    if(e.gamma==null)return;
    st.gx=Math.max(-1,Math.min(1,e.gamma/30)); st.gy=Math.max(-1,Math.min(1,(e.beta-45)/30));
  }
  if('DeviceOrientationEvent' in window && !fine){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      addEventListener('touchend',function once(){
        DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',gyro)}).catch(()=>{});
        removeEventListener('touchend',once);
      },{once:true});
    }else addEventListener('deviceorientation',gyro);
  }

  function tick(){
    const tx=fine?st.mx:st.gx, ty=fine?st.my:st.gy;
    st.cx+=(tx-st.cx)*.07; st.cy+=(ty-st.cy)*.07; st.cs+=(st.sy-st.cs)*.09;
    if(!reduce){
      for(const k in L){
        const x=-st.cx*innerWidth*depth[k], y=-st.cy*innerHeight*depth[k]-st.cs*sdepth[k];
        L[k].style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`;
      }
      // телефони: легкий паралакс по скролу (без 3D-нахилу — щоб не було розмиття)
      phones.forEach((p,i)=>{
        const f=i?-.02:.01;
        p.style.translate=`0 ${Math.round(st.cs*f)}px`;
      });
    }
    requestAnimationFrame(tick);
  }
  tick();

  /* --- i18n --- */
  const i18n={
    en:{
      settingsBtn:'Settings',settingsTitle:'Settings',langTitle:'Language',
      themeTitle:'Theme',themeDark:'Dark',themeLight:'Light',
      screenTitle:'Display',blurLab:'Blur',blurSub:'Blur inactive screens',
      crispLab:'Max sharpness',crispSub:'No soft-scale or blur, logo stays sharp',
      tiltLab:'3D effect',tiltSub:'0% — off, 100% — default, 150% — stronger',
      textTitle:'Text in columns',textCol1Lab:'Column 1',textCol2Lab:'Column 2',
      textCol1Ph:'Type text for the left column…',textCol2Ph:'Type text for the right column…',
      gradTitle:'Gradient',hint:'Type text above — it appears in the columns. Pick a gradient for accents.',
      toastDark:'Dark theme',toastLight:'Light theme',
      toastBlurOff:'Blur fully disabled',toastBlurOn:'Blur enabled',
      toastCrispOn:'Max sharpness',toastCrispOff:'Normal sharpness',
      toastLang:'Language: English'
    },
    uk:{
      settingsBtn:'Налаштування',settingsTitle:'Налаштування',langTitle:'Мова',
      themeTitle:'Тема',themeDark:'Темна',themeLight:'Світла',
      screenTitle:'Екран',blurLab:'Блюр',blurSub:'Розмиття неактивних екранів',
      crispLab:'Максимальна чіткість',crispSub:'Без soft-scale і blur, логотип лишається якісним',
      tiltLab:'3D-ефект',tiltSub:'0% — вимкнено, 100% — стандарт, 150% — сильніше',
      textTitle:'Текст у колонках',textCol1Lab:'Колонка 1',textCol2Lab:'Колонка 2',
      textCol1Ph:'Напиши текст для лівої колонки…',textCol2Ph:'Напиши текст для правої колонки…',
      gradTitle:'Градієнт',hint:'Пиши текст вище — він з’явиться в колонках. Обери градієнт для акцентів.',
      toastDark:'Темна тема',toastLight:'Світла тема',
      toastBlurOff:'Блюр повністю вимкнено',toastBlurOn:'Блюр увімкнено',
      toastCrispOn:'Максимальна чіткість',toastCrispOff:'Звичайна чіткість',
      toastLang:'Мова: Українська'
    }
  };
  let lang='en';
  function t(key){return (i18n[lang]&&i18n[lang][key])||i18n.en[key]||key}
  function applyLang(code){
    lang=code==='uk'?'uk':'en';
    document.documentElement.lang=lang==='uk'?'uk':'en';
    $$('[data-i18n]').forEach(el=>{
      const k=el.getAttribute('data-i18n');
      if(k&&i18n[lang][k]!=null)el.textContent=i18n[lang][k];
    });
    $$('[data-i18n-placeholder]').forEach(el=>{
      const k=el.getAttribute('data-i18n-placeholder');
      if(k&&i18n[lang][k]!=null)el.placeholder=i18n[lang][k];
    });
    $$('#langSeg button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    const pb=$('#paramsBtn');if(pb)pb.title=t('settingsBtn');
    if(window.renderCols)window.renderCols(lang);
  }
  $('#langEn').addEventListener('click',e=>{e.stopPropagation();applyLang('en');say(t('toastLang'))});
  $('#langUk').addEventListener('click',e=>{e.stopPropagation();applyLang('uk');say(t('toastLang'))});
  applyLang('en');

  /* --- тост --- */
  const toast=$('#toast'); let tt;
  function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)}

  /* --- текст у колонках з полів налаштувань --- */
  const ta1=$('#textCol1'), ta2=$('#textCol2');
  const out1=$('#colText1'), out2=$('#colText2');
  function syncCol(ta,out){if(ta&&out)out.textContent=ta.value}
  if(ta1){ta1.addEventListener('input',()=>window.renderCols(lang))}
  if(ta2){ta2.addEventListener('input',()=>window.renderCols(lang));window.renderCols(lang)}
  // не закривати панель при кліку в textarea
  [ta1,ta2].forEach(el=>{if(el)el.addEventListener('click',e=>e.stopPropagation())});

  /* --- тема / блюр / чіткість / 3D --- */
  const blurToggle=$('#blurToggle'), crispToggle=$('#crispToggle');
  function setToggle(el,on){
    el.classList.toggle('on',on);
    el.setAttribute('aria-pressed',String(on));
  }
  function setTheme(mode){
    document.body.classList.toggle('theme-light',mode==='light');
    $$('#themeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.theme===mode));
    say(mode==='light'?t('toastLight'):t('toastDark'));
  }
  $('#themeDark').addEventListener('click',e=>{e.stopPropagation();setTheme('dark')});
  $('#themeLight').addEventListener('click',e=>{e.stopPropagation();setTheme('light')});

  blurToggle.addEventListener('click',e=>{
    e.stopPropagation();
    const blurOn=!document.body.classList.contains('no-blur');
    if(blurOn){
      document.body.classList.add('no-blur');
      setToggle(blurToggle,false);
      say(t('toastBlurOff'));
    }else{
      document.body.classList.remove('no-blur');
      setToggle(blurToggle,true);
      if(document.body.classList.contains('crisp')){
        document.body.classList.remove('crisp');
        setToggle(crispToggle,false);
      }
      say(t('toastBlurOn'));
    }
  });
  crispToggle.addEventListener('click',e=>{
    e.stopPropagation();
    const crispOn=document.body.classList.toggle('crisp');
    setToggle(crispToggle,crispOn);
    if(crispOn){
      document.body.classList.add('no-blur');
      setToggle(blurToggle,false);
      say(t('toastCrispOn'));
    }else{
      say(t('toastCrispOff'));
    }
  });
  /* сила 3D: 0–150% */
  const tiltRange=$('#tiltRange'), tiltVal=$('#tiltVal');
  window.__tiltStrength=1;
  function applyTiltStrength(v){
    const n=Math.max(0,Math.min(150,Number(v)||0));
    window.__tiltStrength=n/100;
    tiltVal.textContent=n+'%';
    document.body.classList.toggle('no-3d',n===0);
    if(n===0){
      $$('.phone').forEach(p=>{p.style.setProperty('--rx','0deg');p.style.setProperty('--ry','0deg')});
    }
  }
  tiltRange.addEventListener('input',e=>{e.stopPropagation();applyTiltStrength(tiltRange.value)});
  tiltRange.addEventListener('click',e=>e.stopPropagation());
  applyTiltStrength(tiltRange.value);

  /* --- колір --- */
  const btn=$('#paramsBtn'),panel=$('#paramsPanel');
  const defaultGrad='linear-gradient(135deg,#2b8be0 0%,#5ac8fa 45%,#bf5af2 100%)';
  function hexes(bg){return bg.match(/#[0-9a-fA-F]{6}/g)||['#5ac8fa']}
  function textColor(bg){
    const hs=hexes(bg);let L=0;
    hs.forEach(h=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);L+=(.299*r+.587*g+.114*b)/255});
    return (L/hs.length)>.62?'#1a1a1a':'#fff';
  }
  function setG(bg){
    const hs=hexes(bg);
    $('#accS1').setAttribute('stop-color',hs[0]);
    $('#accS2').setAttribute('stop-color',hs[hs.length-1]);
  }
  function apply(v){
    root.style.setProperty('--accent',v);
    root.style.setProperty('--accent-text',textColor(v));
    root.style.setProperty('--link',hexes(v)[0]);
    setG(v);
  }
  function active(el){$$('.swatch').forEach(s=>s.classList.remove('active'));el&&el.classList.add('active')}
  apply(defaultGrad);
  btn.addEventListener('click',e=>{e.stopPropagation();panel.classList.toggle('open')});
  document.addEventListener('click',e=>{if(!panel.contains(e.target)&&!btn.contains(e.target))panel.classList.remove('open')});
  $('#gradSwatches').addEventListener('click',e=>{
    const s=e.target.closest('.swatch');if(!s)return;
    active(s);apply(s.dataset.grad);
  });
})();

</script>

<script>
(function(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cube=(a,b,c,st)=>`<svg viewBox="0 0 100 100"><g stroke="${st}" stroke-width="4" stroke-linejoin="round"><path fill="${a}" d="M50 6 90 28 50 50 10 28Z"/><path fill="${b}" d="M10 28 50 50 50 94 10 72Z"/><path fill="${c}" d="M90 28 50 50 50 94 90 72Z"/></g></svg>`;

  $$('.swatch').forEach((s,i)=>s.style.setProperty('--k',i%8));

  /* --- бурст кубиків по кліку --- */
  const layer=document.createElement('div');layer.className='bursts';document.body.appendChild(layer);
  const tones=[['#e8edf2','#b9c2cb','#8f9aa6'],['#ffffff','#cfd6dd','#9aa5b1'],['#aeb8c2','#8c99a6','#6d7a87']];
  function burst(x,y){
    if(reduce)return;
    for(let i=0;i<9;i++){
      const a=Math.random()*Math.PI*2, r=40+Math.random()*70, el=document.createElement('i');
      const t=tones[i%3];
      el.className='bp';
      el.style.cssText=`left:${x}px;top:${y}px;--s:${(9+Math.random()*10).toFixed(0)}px;--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r-20).toFixed(0)}px;--rt:${((Math.random()-.5)*540).toFixed(0)}deg`;
      el.innerHTML=cube(t[0],t[1],t[2],'#1a232e');
      layer.appendChild(el);setTimeout(()=>el.remove(),900);
    }
  }
  addEventListener('pointerdown',e=>burst(e.clientX,e.clientY),{passive:true});
})();
</script>

<script>
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const phones=[...document.querySelectorAll('.phone')], body=document.body;
  setTimeout(()=>body.classList.add('ready'),1500);
  const f=v=>{const k=Math.max(0,(Math.abs(v)-.55)/.45);return Math.sign(v)*k*k};
  phones.forEach(p=>{
    p.addEventListener('pointerenter',()=>{phones.forEach(o=>o.classList.toggle('on',o===p));body.classList.add('has-on')});
    p.addEventListener('pointerleave',()=>{p.classList.remove('on');p.style.setProperty('--rx','0deg');p.style.setProperty('--ry','0deg');body.classList.remove('has-on')});
    p.addEventListener('pointermove',e=>{
      if(document.body.classList.contains('no-3d'))return;
      const s=typeof window.__tiltStrength==='number'?window.__tiltStrength:1;
      const r=p.getBoundingClientRect();
      const nx=(e.clientX-r.left)/r.width*2-1, ny=(e.clientY-r.top)/r.height*2-1;
      p.style.setProperty('--ry',(f(nx)*9*s).toFixed(2)+'deg');
      p.style.setProperty('--rx',(-f(ny)*6*s).toFixed(2)+'deg');
    });
  });
})();
</script>
